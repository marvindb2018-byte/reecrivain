<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réécrivain</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 160px; padding: .75rem; font: inherit; box-sizing: border-box; }
    .tones button { margin: .2rem; padding: .5rem .9rem; cursor: pointer; border: 1px solid #999; border-radius: 6px; background: #fff; }
    .tones button.active { background: #333; color: #fff; }
    #go { padding: .6rem 1.4rem; font-size: 1rem; cursor: pointer; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f5f5; padding: 1rem; border-radius: 8px; margin-top: .5rem; }
    #result:empty { min-height: 80px; }
        #error { color: #c00; }
    #history .entry { border: 1px solid #ddd; border-radius: 8px; padding: .75rem; margin-bottom: .5rem; }
    #history small { color: #666; display: block; margin-bottom: .3rem; }
    #history .entry div { white-space: pre-wrap; margin-bottom: .4rem; }
      :root { --bg: #f4f5fb; --card: #ffffff; --text: #1f2430; --muted: #6b7280; --accent: #4f46e5; --accent-soft: #eef0ff; --border: #e2e4ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14151c; --card: #1e2029; --text: #eceef5; --muted: #9aa0b4; --accent: #818cf8; --accent-soft: #2a2d45; --border: #2f3242; }
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; line-height: 1.5; }
    h1 { font-size: 2rem; margin-bottom: 1.2rem; }
    h3 { margin: 1.8rem 0 .6rem; }
    textarea { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); resize: vertical; }
    textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .tones { margin: .8rem 0; }
    .tones button { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: .45rem 1rem; margin: .2rem .3rem .2rem 0; transition: all .15s; }
    .tones button:hover { border-color: var(--accent); }
    .tones button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #go { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: .7rem 1.6rem; font-weight: 600; }
    #go:hover { opacity: .9; }
    #result { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    #copy, #clearHistory, #history button { background: var(--accent-soft); color: var(--accent); border: none; border-radius: 8px; padding: .4rem .9rem; cursor: pointer; font: inherit; }
    #history .entry { background: var(--card); border-color: var(--border); }
    #history small { color: var(--muted); }
  .results { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
    .col { flex: 1 1 300px; min-width: 0; }
    #translation { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-top: .5rem; }
    #translation:empty { min-height: 80px; }
    #copyTrans { background: var(--accent-soft); color: var(--accent); border: none; border-radius: 8px; padding: .4rem .9rem; cursor: pointer; font: inherit; }
    select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .8rem; font: inherit; }
  .slider { margin: .8rem 0; }
    .slider input[type=range] { width: 100%; accent-color: var(--accent); }
    .slider-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Réécrivain</h1>

  <textarea id="input" placeholder="Colle ton texte ici..."></textarea>

  <div class="tones">
    <button data-tone="professionnel" class="active">Professionnel</button>
    <button data-tone="courtois">Courtois</button>
    <button data-tone="joyeux">Joyeux</button>
    <button data-tone="concis">Concis</button>
    <button data-tone="decontracte">Décontracté</button>
    <div class="slider">
      <label for="intensity">Intensité : <strong id="intensityLabel">Modéré</strong></label>
      <input type="range" id="intensity" min="1" max="5" step="1" value="3">
      <div class="slider-labels"><span>Léger</span><span>Marqué</span></div>
    </div>
  </div>

  <p>
    <label for="lang">Traduire aussi en :</label>
    <select id="lang">
      <option value="auto">Pas de traduction</option>
      <option value="fr">Français</option>
      <option value="en">Anglais</option>
      <option value="es">Espagnol</option>
      <option value="de">Allemand</option>
      <option value="it">Italien</option>
      <option value="pt">Portugais</option>
      <option value="nl">Néerlandais</option>
      <option value="ar">Arabe</option>
      <option value="zh">Chinois</option>
      <option value="ja">Japonais</option>
    </select>
  </p>

  <p><label><input type="checkbox" id="clean" checked> Retirer les incivilités (insultes, vulgarité, agressivité)</label></p>

  <p><button id="go">Réécrire</button> <span id="status"></span></p>
  <p id="error"></p>

  <h3>Résultat</h3>
  <div class="results">
    <div class="col">
      <div id="result"></div>
    <button id="copy">Copier</button>
    </div>
    <div class="col" id="transCol" hidden>
      <div id="translation"></div>
      <button id="copyTrans">Copier la traduction</button>
    </div>
  </div>

  <h3>Historique</h3>
  <div id="history"></div>
  <button id="clearHistory">Effacer l'historique</button>

  <script>
    let tone = "professionnel";
    const buttons = document.querySelectorAll("[data-tone]");

    buttons.forEach(b => b.addEventListener("click", () => {
      tone = b.dataset.tone;
      buttons.forEach(x => x.classList.toggle("active", x === b));
    }));

    document.getElementById("go").addEventListener("click", async () => {
      const text = document.getElementById("input").value;
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.textContent = "";
      result.textContent = "";
      document.getElementById("transCol").hidden = true;
      status.textContent = "Réécriture en cours...";

      try {
        const res = await fetch("/api/rewrite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ clean: document.getElementById("clean").checked, text, tone, lang: document.getElementById("lang").value, intensity: Number(document.getElementById("intensity").value) }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
                result.textContent = data.result;
        document.getElementById("translation").textContent = data.translation || "";
        document.getElementById("transCol").hidden = !data.translation;
        if (!data.translation && document.getElementById("lang").value !== "auto") {
          error.textContent = "La traduction n'a pas pu être générée.";
        }
        addToHistory(text, tone, data.result);
      } catch (e) {
        error.textContent = e.message || "Une erreur est survenue";
      } finally {
        status.textContent = "";
      }
    });

    document.getElementById("copy").addEventListener("click", () => {
            navigator.clipboard.writeText(document.getElementById("result").textContent);
    });

    document.getElementById("copyTrans").addEventListener("click", () => {
      navigator.clipboard.writeText(document.getElementById("translation").textContent);
    });

    const NAMES = ["Très léger", "Léger", "Modéré", "Marqué", "Très marqué"];
    const slider = document.getElementById("intensity");
    slider.addEventListener("input", () => {
      document.getElementById("intensityLabel").textContent = NAMES[slider.value - 1];
    });

    const KEY = "reecrivain_history";

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      try {
        localStorage.setItem(KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function addToHistory(original, tone, result) {
      const list = loadHistory();
      list.unshift({ original, tone, result, date: new Date().toLocaleString("fr-FR") });
      saveHistory(list.slice(0, 10));
      renderHistory();
    }

    function renderHistory() {
      const box = document.getElementById("history");
      const list = loadHistory();
      box.innerHTML = "";
      if (!list.length) {
        box.textContent = "Aucune réécriture pour l'instant.";
        return;
      }
      list.forEach(item => {
        const div = document.createElement("div");
        div.className = "entry";
        const meta = document.createElement("small");
        meta.textContent = item.date + " · " + item.tone;
        const txt = document.createElement("div");
        txt.textContent = item.result;
        const btn = document.createElement("button");
        btn.textContent = "Réutiliser";
        btn.addEventListener("click", () => {
          document.getElementById("input").value = item.original;
          document.getElementById("result").textContent = item.result;
          document.getElementById("transCol").hidden = true;
        });
        div.append(meta, txt, btn);
        box.appendChild(div);
      });
    }

    document.getElementById("clearHistory").addEventListener("click", () => {
      saveHistory([]);
      renderHistory();
    });

    renderHistory();
  </script>
</body>
</html>
